# Keeps the Streamlit Community Cloud app awake.
# Streamlit puts apps to sleep after ~12h without visitors, and a plain HTTP ping
# doesn't count as a visit, so this opens the app in a real headless browser
# (and clicks the "wake up" button if it has already gone to sleep).
#
# Optional override: repo Settings -> Secrets and variables -> Actions -> Variables
#                    -> STREAMLIT_APP_URL = https://<your-app>.streamlit.app
name: Keep Streamlit app awake

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours
  workflow_dispatch:

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Visit app
        env:
          APP_URL: ${{ vars.STREAMLIT_APP_URL || 'https://amaan-ai-resume-reviewer.streamlit.app/' }}
        run: |
          python - <<'PY'
          import os
          from playwright.sync_api import sync_playwright

          url = os.environ["APP_URL"]
          with sync_playwright() as p:
              page = p.chromium.launch().new_page()
              page.goto(url, wait_until="domcontentloaded", timeout=60000)
              wake = page.get_by_role("button", name="Yes, get this app back up!")
              try:
                  wake.wait_for(timeout=15000)
                  wake.click()
                  print("App was asleep - clicked wake-up button")
                  page.wait_for_timeout(90000)
              except Exception:
                  print("App is awake")
                  page.wait_for_timeout(20000)
          PY
